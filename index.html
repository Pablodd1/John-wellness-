<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e100f" />
    <title>CuasarX Longevity By Keel — Precision Bio-Intelligence &amp; Regimens</title>
    <meta name="description" content="CuasarX Longevity By Keel: Clinical longevity marketplace, daily supplement management, organ system biological age modeling, and bio-intelligence optimization." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#0e100f] bg-office text-[#f4f2ec] antialiased selection:bg-orange-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!--
      Quasar Keel — voice receptionist (VoiceLayer, generic drop-in; site data is
      fed by the app via VoiceLayer.setSignals, advice via the aiAnswer hook
      which is gated by the user's AI-processing consent).
      Hide: minimize to the edge tab, "Turn off voice help", or ?voicelayer=off.
      Voice interactions are logged as intent events only when Product
      Analytics consent is on (see Privacy & Consent).
    -->
    <link rel="stylesheet" href="/voicelayer/voicelayer.css">
    <script>
      window.VoiceLayerConfig = {
        apiBase: (location.hostname === 'localhost' || location.hostname === '127.0.0.1') ? 'http://localhost:8790/api/voice' : (window.__VOICELAYER_API_BASE || '/api/voice'),
        mode: 'glass',
        offsetY: 84,
        language: 'en',
        bubble: false,
        knowledge: { autoNav: false, minScore: 0.45 },
        glass: { dock: 'top', height: 0.16, blur: 4, tint: 0.15, hue: 215, lite: 'auto' },
        orbPosition: { corner: 'center', offsetX: 0, offsetY: 0, size: 35 },
        companion: {
          preset: 'wellness',
          name: 'Quasar Keel',
          demo: false,
          signalsUrl: null,
          signals: null,            // set live by the app: window.VoiceLayer.setSignals(...)
          catalog: window.__CUASARX_CATALOG || []
        },
        aiAnswer: async function (question, ctx) {
          try {
            var consent = JSON.parse(localStorage.getItem('cx_consent_state_v1') || '{}');
            var aiRec = consent && consent.records && consent.records.ai_processing;
            // Only block if the user explicitly withdrew AI processing consent; otherwise allow interactive voice questions and fall back to VoiceLayer /api/voice/ask + absorbed site knowledge
            if (aiRec && aiRec.granted === false && aiRec.withdrawnAt) return null;
            var headers = { 'Content-Type': 'application/json' };
            try {
              var st = JSON.parse(localStorage.getItem('sb-aklpnzhpetinlmkteifp-auth-token') || 'null');
              if (st && st.access_token) headers['Authorization'] = 'Bearer ' + st.access_token;
            } catch (e) {}
            var mergedCtx = Object.assign({}, window.__CUASARX_COACH_CTX || {}, { voiceLayerContext: ctx || {} });
            var res = await fetch('/api/coach', {
              method: 'POST',
              headers: headers,
              body: JSON.stringify({ message: question, context: mergedCtx })
            });
            if (!res.ok) return null;
            var data = await res.json();
            return data && data.reply ? { text: data.reply, action: data.action || null } : null;
          } catch (e) { return null; }
        }
      };
    </script>
    <script src="/voicelayer/voicelayer.js" defer></script>
  </body>
</html>
